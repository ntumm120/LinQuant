[project]
name = "linquant"
version = "0.1.0"
description = "Rotation and rescaling invariances for quantizing chunkwise linear attention (LinQuant)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch==2.8.0",
    "triton==3.4.0",
    "fla-core==0.4.1",
    "mamba-ssm==2.2.6.post3",
    "causal-conv1d==1.5.3.post1",
    "transformers==4.56.2",
    "datasets>=3.3",
    "safetensors",
    "sentencepiece",
    "filelock",
    "einops",
    "numpy",
    "tqdm",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linquant", "linquant.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
